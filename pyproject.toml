[project]
name = "db-ia-store"
version = "0.1.0"
description = "Asistente de ventas multi-agente para tienda de productos"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "jesustr20", email = "jesus.tr61@gmail.com" }
]
dependencies = [
    "fastapi[all]>=0.115.6",
    "sqlalchemy>=2.0.36",
    "google-generativeai>=0.8.3",
    "twilio>=9.4.1",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]