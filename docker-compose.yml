# Issue #19 — Orquestación local completa: API + worker + PostgreSQL + Redis + ChromaDB.
#
# Uso:
#   docker compose up --build -d     # levanta todo
#   docker compose ps                # estado de los 5 servicios
#   docker compose down              # baja (conserva volúmenes)
#   docker compose down -v           # baja y borra volúmenes (borrón y cuenta nueva)
#
# Los servicios se hablan por nombre de servicio (postgres, redis, chroma), no por
# localhost. Los secretos (GEMINI_API_KEY, SECRET_KEY, SENTRY_DSN) vienen del .env vía
# `env_file`; acá solo se configuran URLs internas y credenciales de desarrollo con
# defaults sobrescribibles vía variables (POSTGRES_USER/PASSWORD/DB).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-db_ia_store}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-db_ia_store}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/data
    # Sin mapeo de puertos al host: api/worker lo alcanzan por la red interna
    # (CHROMA_HOST=chroma). Para debuggear se puede usar `docker compose exec chroma`.
    healthcheck:
      # La imagen chromadb/chroma es mínima (no trae curl/python). Verificamos que el
      # server responda abriendo una conexión TCP al puerto 8000 con bash (/dev/tcp).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: .
    image: ia-store:local
    env_file: .env
    environment:
      # Sobrescribe las URLs "localhost" del .env por los nombres de servicio.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-db_ia_store}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --app-dir src --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy

  worker:
    image: ia-store:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-db_ia_store}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    command: celery -A app.infrastructure.tasks.celery_app:celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy

volumes:
  postgres_data:
  chroma_data:
